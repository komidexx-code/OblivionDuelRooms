
settings:
  prefix: "&8[&5OblivionDuels&8] "
  debug: false

matchmaking:
  enabled: true
  modes:
    - 1v1
    - 2v2
    - 3v3
    - 4v4
    - 5v5
  countdown-seconds: 10
  disconnect-grace-seconds: 30
  match-timeout-minutes: 15

combat:
  friendly-fire: false
  allow-pearls: true
  allow-chorus-fruit: false
  allow-elytra: false
  prevent-teleport-escape: true

loot:
  enabled: true
  drop-defeated-player-items: true
  winner-team-can-collect: true
  keep-inventory: false

statistics:
  enabled: true
  leaderboard-size: 10

storage:
  type: SQLITE
  database: duels.db

match-hud:
  enabled: true

  scoreboard:
    enabled: true
    title: "&5&lOBLIVION DUELS"
    team-a-name: "&e&lTEAM A"
    team-b-name: "&b&lTEAM B"

  timer:
    enabled: true
    title: "&5&lMATCH TIME"
    color: PURPLE

  score-sound:
    enabled: true
    sound: ENTITY_FIREWORK_ROCKET_BLAST
    volume: 1.0
    pitch: 1.0

arenas: {}
