
name: Build OblivionDuels

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Build plugin
        run: mvn -B clean package

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: OblivionDuels-JAR
          path: target/*.jar
          
